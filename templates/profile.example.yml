# Copy to profile.local.yml (git-ignored) and fill in. Nothing here is real.
candidate:
  display_name: "Alex Example"        # used only in drafts you review
  city: "Example City"
  languages: ["English (C1)"]

# Written by prompts/onboarding.md ONLY after the user approved the list in chat.
# Scans refuse to run if this section is missing or approved is not true.
approved_roles:
  approved: true
  approved_on: "2000-01-01"
  roles:
    - title: "Business Analyst"
      reason: "Fictional: requirements work across two projects"
      cv_evidence: "Fictional CV line: 'Wrote requirements for 3 release cycles'"
    - title: "Product Owner"
      reason: "Fictional: backlog ownership"
      cv_evidence: "Fictional CV line: 'Owned the team backlog'"

targets:
  roles:                              # full score for these
    - "Business Analyst"
    - "Product Owner"
    - "Implementation Consultant"
    - "Release / Change Manager"
  adjacent_roles:                     # half score
    - "Project Coordinator"

exclusions:                           # hard: reject, do not score
  roles: ["Helpdesk / L1-L2 support", "Pure manual QA"]
  skills_as_hard_requirement: ["<SKILL_YOU_LACK>"]
  locations: ["<DISTRICT_TOO_FAR>"]
  remote_exception: true              # excluded locations are fine if remote

always_include_companies:             # always opened and scored, never skipped on seniority alone
  - "<COMPANY_A>"
  - "<COMPANY_B>"

locations:
  accepted: ["Example City", "Remote"]
  work_model: ["on-site", "hybrid", "remote"]

compensation:
  currency: "<CURRENCY>"
  net_monthly_expectation: "<NUMBER>"  # used only if a form requires a single number
  gross_annual_expectation: "<NUMBER>"

form_facts:                           # the ONLY facts the agent may use in forms
  start_availability: "immediately"
  work_authorization: "<ANSWER>"
  driving_licence: "<ANSWER>"
  military_service: "<ANSWER_OR_NOT_APPLICABLE>"
  years_of_experience:                # keep consistent with the CV
    sql: 0
    python: 0

queries:
  jobs:
    - "business analyst"
    - "product owner"
    - "implementation consultant"
    - "release manager"
  posts:
    - "hiring business analyst <city>"
    - "<role> we are hiring"
  skills: []                          # skill keywords (CV-backed, in demand); see prompts/linkedin-profile.md
  career_sites: []                    # optional career pages for the title-only check

limits:                               # asked in onboarding; HARD upper bounds in scans
  scans_per_day: 1                    # search rounds per day (suggest 1)
  max_evaluated_per_round: 15         # listings opened and scored per round
  max_prepared_per_round: 5           # applications/drafts prepared per round
  daily_prepared_cap: 5               # all rounds together
  approval_mode: "one_by_one"         # one_by_one | batch_summary

mail:                                 # hints for the Gmail reply check
  sender_hints: ["interview", "application", "invitation", "assessment"]
  ats_domains: ["<ATS_DOMAIN>"]

portals:                              # sites you allowed the browser to use
  - "linkedin.com"
